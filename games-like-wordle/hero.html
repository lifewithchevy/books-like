<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;
     font-family:'Inter',system-ui,sans-serif;
     background:#170d1c}
/* one soft key light, off-centre, rather than two competing glows */
.key{position:absolute;width:1100px;height:1100px;left:50%;top:-560px;transform:translateX(-50%);
     border-radius:50%;background:radial-gradient(circle,rgba(139,63,211,.34) 0%,rgba(217,70,168,.13) 38%,transparent 66%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:250px;
       background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}

/* shelf: one even row, consistent size, gentle arc. no random rotations */
.shelf{position:absolute;left:0;right:0;bottom:18px;height:236px;
       display:flex;align-items:flex-end;justify-content:center;gap:-0px}
.shelf img{width:134px;height:201px;object-fit:cover;border-radius:6px;
           border:1px solid rgba(255,255,255,.12);
           box-shadow:0 18px 40px rgba(0,0,0,.6)}
.shelf img{margin:0 -9px}
.shelf img:nth-child(1),.shelf img:nth-child(9){transform:translateY(26px) scale(.9);opacity:.40}
.shelf img:nth-child(2),.shelf img:nth-child(8){transform:translateY(16px) scale(.95);opacity:.60}
.shelf img:nth-child(3),.shelf img:nth-child(7){transform:translateY(8px);opacity:.82}
.shelf img:nth-child(4),.shelf img:nth-child(6){transform:translateY(3px);opacity:.95}
.shelf img:nth-child(5){transform:translateY(-4px) scale(1.04)}
.fade{position:absolute;left:0;right:0;bottom:0;height:260px;pointer-events:none;
      background:linear-gradient(to right,#170d1c 0%,rgba(23,13,28,.15) 14%,transparent 26%,transparent 74%,rgba(23,13,28,.15) 86%,#170d1c 100%)}

.stage{position:absolute;left:0;right:0;top:66px;display:flex;flex-direction:column;
       align-items:center;text-align:center}
.mark{height:25px;width:auto;opacity:.78;margin-bottom:26px}
.board{display:grid;grid-template-columns:repeat(5,76px);gap:10px;margin-bottom:28px}
.t{width:76px;height:76px;border-radius:11px;display:flex;align-items:center;justify-content:center;
   font-weight:800;font-size:38px;color:#fff;letter-spacing:.5px;
   background:linear-gradient(180deg,#9b4ce0,#7d34c4);
   box-shadow:0 12px 26px rgba(123,45,196,.42), inset 0 1px 0 rgba(255,255,255,.22)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:54px;line-height:1;
   color:#fff;letter-spacing:.4px;margin-bottom:11px}
.sub{font-size:17px;font-weight:600;color:#c2a3c9;letter-spacing:.2px}
.sub b{color:#f0b8dd;font-weight:700}
</style></head><body>
<div class="key"></div>
<div class="shelf">
  <img src="/booky/covers/caraval.jpg">
  <img src="/booky/covers/the-cruel-prince.jpg">
  <img src="/booky/covers/a-court-of-thorns-and-roses.jpg">
  <img src="/booky/covers/onyx-storm.jpg">
  <img src="/booky/covers/fourth-wing.jpg">
  <img src="/booky/covers/threshing-day.jpg">
  <img src="/booky/covers/quicksilver.jpg">
  <img src="/booky/covers/divine-rivals.jpg">
  <img src="/booky/covers/powerless.jpg">
</div>
<div class="floor"></div><div class="fade"></div>
<div class="stage">
  <img class="mark" src="/logo/booky-light.svg" alt="">
  <div class="board">
    <div class="t">B</div><div class="t">O</div><div class="t">O</div><div class="t">K</div><div class="t">Y</div>
  </div>
  <h1>31 games like Wordle</h1>
  <p class="sub">Every one played and checked &middot; <b>September 2026</b></p>
</div>
</body></html>
