<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',system-ui,sans-serif;
     background:linear-gradient(160deg,#1a0f1f 0%,#2e1533 45%,#45204a 100%);position:relative}
.glow{position:absolute;width:900px;height:900px;left:-180px;top:-330px;border-radius:50%;
      background:radial-gradient(circle,rgba(217,70,168,.30) 0%,rgba(139,63,211,.10) 45%,transparent 68%)}
.glow2{position:absolute;width:780px;height:780px;right:-230px;bottom:-330px;border-radius:50%;
       background:radial-gradient(circle,rgba(212,168,83,.22) 0%,transparent 66%)}
.shelf{position:absolute;inset:0}
.shelf img{position:absolute;border-radius:6px;object-fit:cover;
           box-shadow:0 20px 44px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.10)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:54px}
.left{display:flex;flex-direction:column;align-items:center;gap:22px}
.board{display:grid;grid-template-columns:repeat(5,74px);gap:9px}
.t{width:74px;height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;
   font-weight:800;font-size:37px;color:#fff;background:rgba(255,255,255,.07);
   border:2px solid rgba(255,255,255,.16)}
.t.ok{background:#8b3fd3;border-color:#8b3fd3}
.t.mid{background:#d4a853;border-color:#d4a853;color:#26121f}
.kicker{font-size:13px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;color:#f0b8dd}
.reveal{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);
        border-radius:18px;padding:24px 26px;display:flex;gap:20px;align-items:center;
        backdrop-filter:blur(3px);box-shadow:0 26px 60px rgba(0,0,0,.42)}
.reveal img{width:118px;height:177px;border-radius:7px;object-fit:cover;
            box-shadow:0 14px 30px rgba(0,0,0,.5)}
.meta{max-width:250px}
.meta .lab{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
           color:#d9a7c9;margin-bottom:8px}
.meta .ttl{font-family:'Cormorant Garamond',Georgia,serif;font-size:31px;line-height:1.08;
           color:#fff;margin-bottom:7px}
.meta .au{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#c0a6c4}
.foot{position:absolute;left:0;right:0;bottom:34px;text-align:center}
.foot .h{font-family:'Cormorant Garamond',Georgia,serif;font-size:37px;color:#fff;letter-spacing:.3px}
.foot .s{font-size:16px;font-weight:600;color:#cba9cf;margin-top:5px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="shelf">
  <img src="/booky/covers/fourth-wing.jpg"                 style="left:-28px; top:44px;  width:118px;height:177px;transform:rotate(-13deg);opacity:.85">
  <img src="/booky/covers/a-court-of-thorns-and-roses.jpg" style="left:44px;  top:268px; width:108px;height:162px;transform:rotate(8deg); opacity:.8">
  <img src="/booky/covers/the-cruel-prince.jpg"            style="left:-14px; top:452px; width:112px;height:168px;transform:rotate(-6deg);opacity:.78">
  <img src="/booky/covers/quicksilver.jpg"                 style="right:-26px;top:58px;  width:118px;height:177px;transform:rotate(12deg);opacity:.85">
  <img src="/booky/covers/onyx-storm.jpg"                  style="right:46px; top:286px; width:106px;height:159px;transform:rotate(-7deg);opacity:.78">
  <img src="/booky/covers/caraval.jpg"                     style="right:-18px;top:456px; width:112px;height:168px;transform:rotate(6deg); opacity:.8">
</div>
<div class="wrap">
  <div class="left">
    <p class="kicker">Daily, free, no app</p>
    <div class="board">
      <div class="t">S</div><div class="t">T</div><div class="t">O</div><div class="t mid">R</div><div class="t">M</div>
    </div>
    <div class="board">
      <div class="t ok">R</div><div class="t ok">I</div><div class="t ok">D</div><div class="t ok">E</div><div class="t ok">R</div>
    </div>
  </div>
  <div class="reveal">
    <img src="/booky/covers/threshing-day.jpg" alt="">
    <div class="meta">
      <p class="lab">The word is from</p>
      <p class="ttl">Threshing Day</p>
      <p class="au">Rebecca Yarros</p>
    </div>
  </div>
</div>
<div class="foot">
  <p class="h">31 games like Wordle</p>
  <p class="s">Checked and updated, September 2026</p>
</div>
</body></html>
