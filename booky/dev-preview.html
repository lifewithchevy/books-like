<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booky dev preview</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  .wrap { display: flex; height: 100%; }
  aside {
    width: 220px;
    flex-shrink: 0;
    padding: 14px 12px;
    background: #1a1a1a;
    border-right: 1px solid #333;
    font-size: 12px;
    line-height: 1.5;
    overflow: auto;
  }
  aside h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  aside label { display: block; margin: 10px 0 4px; color: #aaa; }
  aside input, aside select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #222;
    color: #fff;
    font-size: 12px;
  }
  aside button {
    margin-top: 10px;
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #d946a8;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
  }
  aside a { color: #f8b6da; }
  aside p { margin: 12px 0 0; color: #888; font-size: 11px; }
  main { flex: 1; min-width: 0; background: #160516; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Booky preview</h1>
    <label for="book">Book slug</label>
    <input id="book" type="text" value="weavingshaw" />
    <label for="format">Format</label>
    <select id="format">
      <option value="">Feed / post</option>
      <option value="story" selected>IG story</option>
    </select>
    <button type="button" id="reload">Reload preview</button>
    <p>Edit <code>booky/styles.css</code> — save and reload (or use live-server auto-refresh).</p>
    <p><a id="open-tab" href="#" target="_blank" rel="noopener">Open promo in new tab</a></p>
  </aside>
  <main>
    <iframe id="frame" title="Booky promo preview"></iframe>
  </main>
</div>
<script>
  const book = document.getElementById('book');
  const format = document.getElementById('format');
  const frame = document.getElementById('frame');
  const openTab = document.getElementById('open-tab');

  function promoUrl() {
    const q = new URLSearchParams({ book: book.value.trim() || 'weavingshaw' });
    if (format.value) q.set('format', format.value);
    return '/booky/promo/?' + q;
  }

  function load() {
    const url = promoUrl();
    frame.src = url;
    openTab.href = url;
  }

  document.getElementById('reload').addEventListener('click', load);
  book.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  format.addEventListener('change', load);
  load();
</script>
</body>
</html>
