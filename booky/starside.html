    var ctx=c.getContext('2d');ctx.fillStyle='#1d1126';ctx.fillRect(0,0,1080,1920);
    ctx.drawImage(image,0,0,1080,1920);URL.revokeObjectURL(url);
    c.toBlob(function(pb){var a=document.createElement('a');a.href=URL.createObjectURL(pb);a.download='booky-starside.png';document.body.appendChild(a);a.click();a.remove();btn.textContent='Download PNG (1080×1920)';},'image/png');
  };
  image.onerror=function(){btn.textContent='Export failed — rebuild in Canva';};
  image.src=url;
}
