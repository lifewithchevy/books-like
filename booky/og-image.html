<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Booky og:image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="og-image-page">
<article class="promo-frame" aria-label="Booky">
  <!-- Filigree corners — same SVG paths as booky/promo-render.js (Heba author promo) -->
  <svg class="promo-filigree-corner promo-filigree-corner--tl" viewBox="-50 -50 100 100" fill="none" aria-hidden="true">
    <g transform="rotate(135)">
      <path d="M0,0 C 8,-13 26,-15 37,-8 C 47,-2 42,9 33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,0 C -8,-13 -26,-15 -37,-8 C -47,-2 -42,9 -33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,-4 L4,0 L0,4 L-4,0 Z" fill="currentColor"/>
      <circle cx="37" cy="2" r="1.4" fill="#e6c887"/>
      <circle cx="-37" cy="2" r="1.4" fill="#e6c887"/>
    </g>
  </svg>
  <svg class="promo-filigree-corner promo-filigree-corner--tr" viewBox="-50 -50 100 100" fill="none" aria-hidden="true">
    <g transform="rotate(-135)">
      <path d="M0,0 C 8,-13 26,-15 37,-8 C 47,-2 42,9 33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,0 C -8,-13 -26,-15 -37,-8 C -47,-2 -42,9 -33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,-4 L4,0 L0,4 L-4,0 Z" fill="currentColor"/>
      <circle cx="37" cy="2" r="1.4" fill="#e6c887"/>
      <circle cx="-37" cy="2" r="1.4" fill="#e6c887"/>
    </g>
  </svg>
  <svg class="promo-filigree-corner promo-filigree-corner--bl" viewBox="-50 -50 100 100" fill="none" aria-hidden="true">
    <g transform="rotate(45)">
      <path d="M0,0 C 8,-13 26,-15 37,-8 C 47,-2 42,9 33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,0 C -8,-13 -26,-15 -37,-8 C -47,-2 -42,9 -33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,-4 L4,0 L0,4 L-4,0 Z" fill="currentColor"/>
      <circle cx="37" cy="2" r="1.4" fill="#e6c887"/>
      <circle cx="-37" cy="2" r="1.4" fill="#e6c887"/>
    </g>
  </svg>
  <svg class="promo-filigree-corner promo-filigree-corner--br" viewBox="-50 -50 100 100" fill="none" aria-hidden="true">
    <g transform="rotate(-45)">
      <path d="M0,0 C 8,-13 26,-15 37,-8 C 47,-2 42,9 33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,0 C -8,-13 -26,-15 -37,-8 C -47,-2 -42,9 -33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,-4 L4,0 L0,4 L-4,0 Z" fill="currentColor"/>
      <circle cx="37" cy="2" r="1.4" fill="#e6c887"/>
      <circle cx="-37" cy="2" r="1.4" fill="#e6c887"/>
    </g>
  </svg>

  <div class="promo-brand">
    <div class="booky-tiles" aria-hidden="true">
      <span>B</span><span>O</span><span>O</span><span>K</span><span>Y</span>
    </div>
    <p class="promo-tagline">romantasy word game</p>
    <svg class="promo-flourish-svg" viewBox="-50 -16 100 28" fill="none" aria-hidden="true">
      <path d="M0,0 C 8,-13 26,-15 37,-8 C 47,-2 42,9 33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,0 C -8,-13 -26,-15 -37,-8 C -47,-2 -42,9 -33,6" stroke="currentColor" stroke-width="3"/>
      <path d="M0,-4 L4,0 L0,4 L-4,0 Z" fill="currentColor"/>
      <circle cx="37" cy="2" r="2" fill="currentColor"/>
      <circle cx="-37" cy="2" r="2" fill="currentColor"/>
    </svg>
  </div>

  <div class="og-demo-grid" aria-hidden="true">
    <span class="correct">F</span>
    <span class="present">A</span>
    <span class="absent">T</span>
    <span class="correct">E</span>
    <span class="correct">D</span>
  </div>

  <p class="promo-footer">daily romantasy word game by <strong>90books</strong></p>
</article>
</body>
</html>
