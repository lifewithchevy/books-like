<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #160516;
    --gold: #c79320;
    --gold-light: #d4a855;
    --ink: #f6ecf3;
    --ink-dim: #b09ab8;
    --ink-faint: #6f5a78;
    --accent: #d946a8;
    --accent-2: #f8b6da;
    --correct: #9333d9;
    --present: #c79320;
    --absent: #3a2842;
  }

  body {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(ellipse 80% 70% at 50% 18%, rgba(217, 70, 168, 0.14) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 82% 82%, rgba(139, 63, 211, 0.10) 0%, transparent 55%),
      var(--bg);
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
    position: relative;
    overflow: hidden;
  }

  .frame {
    position: absolute;
    inset: 28px;
    border: 2px solid var(--gold);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .corner {
    position: absolute;
    width: 72px;
    height: 72px;
    color: var(--gold);
  }
  .corner.tl { top: 10px; left: 10px; }
  .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
  .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
  .corner.br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

  .logo-row {
    display: flex;
    gap: 8px;
  }

  .logo-tile {
    width: 68px;
    height: 68px;
    border: 2px solid var(--gold);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 34px;
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: 0;
    background: rgba(34, 17, 39, 0.55);
  }

  .tagline {
    font-size: 30px;
    font-weight: 500;
    font-style: italic;
    color: var(--accent-2);
    letter-spacing: 0.4px;
    margin-top: -4px;
  }

  .divider {
    width: 120px;
    height: 18px;
    color: var(--gold);
    opacity: 0.85;
  }

  .grid {
    display: flex;
    gap: 10px;
  }

  .tile {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
  }
  .tile.correct { background: var(--correct); }
  .tile.present { background: var(--present); }
  .tile.absent  { background: var(--absent); color: var(--ink); }

  .footer {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.2px;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="frame">
    <svg class="corner tl" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <path d="M8 8 C8 28 18 38 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 8 C28 8 38 18 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 20 C8 32 14 38 26 38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="8" cy="8" r="3" fill="currentColor"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <path d="M8 8 C8 28 18 38 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 8 C28 8 38 18 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 20 C8 32 14 38 26 38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="8" cy="8" r="3" fill="currentColor"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <path d="M8 8 C8 28 18 38 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 8 C28 8 38 18 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 20 C8 32 14 38 26 38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="8" cy="8" r="3" fill="currentColor"/>
    </svg>
    <svg class="corner br" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <path d="M8 8 C8 28 18 38 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 8 C28 8 38 18 38 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 20 C8 32 14 38 26 38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="8" cy="8" r="3" fill="currentColor"/>
    </svg>

    <div class="logo-row" aria-hidden="true">
      <div class="logo-tile">B</div>
      <div class="logo-tile">O</div>
      <div class="logo-tile">O</div>
      <div class="logo-tile">K</div>
      <div class="logo-tile">Y</div>
    </div>
    <div class="tagline">romantasy word game</div>

    <svg class="divider" viewBox="0 0 120 18" fill="none" aria-hidden="true">
      <path d="M0 9 H44" stroke="currentColor" stroke-width="1.5"/>
      <path d="M76 9 H120" stroke="currentColor" stroke-width="1.5"/>
      <path d="M52 9 C56 4 64 4 68 9 C64 14 56 14 52 9 Z" fill="currentColor" opacity="0.9"/>
    </svg>

    <div class="grid" aria-hidden="true">
      <div class="tile correct">F</div>
      <div class="tile present">A</div>
      <div class="tile absent">T</div>
      <div class="tile correct">E</div>
      <div class="tile correct">D</div>
    </div>

    <div class="footer">daily romantasy word game by 90books</div>
  </div>
</body>
</html>
