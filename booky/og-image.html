<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: radial-gradient(ellipse 80% 70% at 50% 20%, rgba(217,70,168,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(139,63,211,0.12) 0%, transparent 55%),
                #160516;
    font-family: Georgia, "Times New Roman", serif;
    color: #f6ecf3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .wordmark {
    font-size: 88px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #f8b6da;
  }
  .tagline {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: #b09ab8;
    letter-spacing: 0.5px;
  }
  .grid {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .tile {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: #fff;
  }
  .correct { background: #9333d9; }
  .present { background: #c79320; }
  .absent  { background: #3a2842; color: #f6ecf3; }
  .domain {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 22px;
    color: #6f5a78;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="wordmark">Booky</div>
  <div class="tagline">The daily romantasy word game</div>
  <div class="grid" aria-hidden="true">
    <div class="tile correct">F</div>
    <div class="tile present">A</div>
    <div class="tile absent">T</div>
    <div class="tile correct">E</div>
    <div class="tile correct">D</div>
  </div>
  <div class="domain">90books.com/booky</div>
</body>
</html>
