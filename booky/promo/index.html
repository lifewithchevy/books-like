<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Booky Author Promo</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#160c1d" />
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #160c1d;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    box-sizing: border-box;
  }
  body.promo-page--story { padding: 28px 16px; }
  .promo-asset-frame {
    width: 400px;
    max-width: 92vw;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
  }
  body.promo-page--story .promo-asset-frame { width: min(400px, 94vw); }
  .promo-asset-frame svg { display: block; width: 100%; height: auto; }
  .promo-error, .promo-loading {
    color: #b496ac;
    font-family: Georgia, serif;
    text-align: center;
    padding: 40px 20px;
    max-width: 360px;
  }
</style>
</head>
<body class="promo-page">
<p id="promo-loading" class="promo-loading">Loading promo…</p>
<div id="promo-mount" class="promo-asset-frame" hidden></div>
<p id="promo-error" class="promo-error" hidden></p>
<script src="/booky/promo-render.js?v=2"></script>
<script src="/booky/book-cover.js?v=1"></script>
<script src="/booky/promo.js?v=3" defer></script>
</body>
</html>
