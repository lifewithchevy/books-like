<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Booky win screen — preview</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/booky/styles.css?v=68" />
<style>
  /* Preview chrome only — not part of the game */
  body.win-preview { overflow: auto; }
  .pv-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 9999;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 8px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(6px);
    font-family: Inter, system-ui, sans-serif;
  }
  .pv-bar a {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .pv-bar a.on { background: #d946a8; border-color: #d946a8; }
  /* Embedded in device-preview iframe — hide dev controls, prod-like layout */
  body.embedded .pv-bar { display: none; }
  body.embedded #end-modal { margin: 0; }
  body.win-preview:not(.embedded) #end-modal {
    position: fixed;
    inset: 0;
  }
  body.embedded #end-modal {
    position: fixed;
    inset: 0;
  }
</style>
</head>
<body class="win-preview">
<script>if (window.self !== window.top) document.body.classList.add('embedded');</script>
<div class="bg-glow" aria-hidden="true"></div>

<nav class="pv-bar">
  <a data-q="win">Win</a>
  <a data-q="loss">Loss</a>
  <a data-q="featured">Featured day</a>
  <a data-q="newbie">First win</a>
  <a data-q="streak">Long streak</a>
</nav>

<!-- Same markup as the real end screen (kept in sync with index.html) -->
<div id="end-modal" class="end-screen" aria-label="Game result">
<div class="sheet-inner end-inner">
<span class="promo-corner promo-corner--tl featured-frame-corner" aria-hidden="true"></span>
<span class="promo-corner promo-corner--tr featured-frame-corner" aria-hidden="true"></span>
<span class="promo-corner promo-corner--bl featured-frame-corner" aria-hidden="true"></span>
<span class="promo-corner promo-corner--br featured-frame-corner" aria-hidden="true"></span>
<button class="sheet-close" aria-label="Close" data-close-end>×</button>

<div class="end-top">
<p id="end-puzzle-no" class="end-puzzle-no"></p>
<div class="celebration" id="celebration">
<h2 id="end-headline" class="celebration-title"></h2>
</div>
<p id="end-word-reveal" class="end-word-reveal" hidden></p>
</div>

<div class="end-stats">
<h3 class="end-section-title">Statistics</h3>
<div class="stat-row end-stat-row">
<div><span id="end-stat-played">0</span><small>played</small></div>
<div><span id="end-stat-winpct">0</span><small>win %</small></div>
<div><span id="end-stat-streak">0</span><small>streak</small></div>
<div><span id="end-stat-max">0</span><small>max</small></div>
</div>
</div>

<div class="end-guesses" id="end-guesses">
<h3 class="end-section-title">Guesses</h3>
<div id="end-dist" class="end-dist" role="img" aria-label="Guesses used this game"></div>
</div>

<div class="end-ranks" id="end-ranks" hidden>
<h3 class="end-section-title">Titles Earned</h3>
<p id="end-milestone" class="end-milestone" hidden></p>
</div>

<div id="share-block" class="end-share">
<button id="share-btn" class="primary share-btn" type="button">
  <span class="share-dust" aria-hidden="true"></span>
  <span class="share-btn__label">Share</span>
</button>
<div id="share-toast" class="share-toast" role="status" aria-live="polite" hidden></div>
</div>

<div id="end-extras" class="end-extras">
<div id="book-rec" class="book-hero book-hero--compact" hidden>
<p class="book-hero-label">📚 Today&rsquo;s word is from</p>
<p id="end-word" class="end-word" aria-hidden="true"></p>
<div class="book-hero-row">
<img id="book-rec-cover" class="book-hero-cover" alt="" hidden />
<div class="book-hero-meta">
<p id="book-rec-title" class="book-hero-title"></p>
<p id="book-rec-author" class="book-hero-author"></p>
<p id="book-rec-hook" class="book-hero-hook" hidden></p>
</div>
</div>
<a id="book-rec-link" class="book-hero-cta secondary-link" target="_blank" rel="noopener" hidden></a>
</div>

<form id="reminder-form" class="reminder-form" novalidate>
<p class="reminder-headline">don&rsquo;t lose your 🔥 streak</p>
<div class="reminder-row">
<input type="email" id="reminder-email" placeholder="your@email.com" aria-label="Email for daily reminders" autocomplete="email" inputmode="email" required />
<button type="submit" id="reminder-submit" class="secondary-link">remind me</button>
</div>
<p class="reminder-toast" id="reminder-toast" hidden></p>
</form>
<p id="reminder-active" class="reminder-active" hidden>📩 Daily reminders on</p>
</div>

<p class="next">next word in <span id="countdown">07:01:53</span></p>
</div>
</div>

<script src="/booky/book-cover.js?v=1"></script>
<script>
const BADGES = [
  { at: 1, icon: '✨', name: 'Initiate', blurb: 'You crossed the veil.' },
  { at: 3, icon: '💫', name: 'Bonded', blurb: 'Three days. Something just clicked.' },
  { at: 7, icon: '🗡️', name: 'Cadet', blurb: 'First week survived. The academy claims you.' },
  { at: 14, icon: '🐉', name: 'Rider', blurb: 'Two weeks. The dragon chose you.' },
  { at: 30, icon: '⚔️', name: 'Knight', blurb: 'A month, sworn. Sharpened by ritual.' },
  { at: 60, icon: '🔮', name: 'Sorceress', blurb: 'Magic mastered. Two months unbroken.' },
  { at: 100, icon: '🏆', name: 'Champion', blurb: '100 days. You won the trial.' },
];
function badgeForStreak(s) {
  let earned = null, next = null;
  for (const b of BADGES) { if (s >= b.at) earned = b; else { next = b; break; } }
  return { earned, next };
}
function milestoneText(s) {
  if (s < 1) return null;
  const { earned, next } = badgeForStreak(s);
  if (!earned) return null;
  let t = `${earned.icon} ${earned.name}`;
  if (next) { const r = next.at - s; t += ` · ${r} day${r === 1 ? '' : 's'} to ${next.icon} ${next.name}`; }
  return t;
}

const SCENARIOS = {
  win:      { won: true,  tries: 4, played: 12, wins: 11, streak: 2, max: 5, word: 'RIDER' },
  loss:     { won: false, tries: 6, played: 12, wins: 10, streak: 0, max: 5, word: 'RIDER' },
  featured: { won: true,  tries: 3, played: 20, wins: 18, streak: 7, max: 9, word: 'GHOST' },
  newbie:   { won: true,  tries: 5, played: 1,  wins: 1,  streak: 1, max: 1, word: 'RIDER' },
  streak:   { won: true,  tries: 2, played: 40, wins: 38, streak: 29, max: 29, word: 'RIDER' },
};

function renderPreviewDist(s) {
  const row = document.getElementById('end-dist');
  if (!row) return;
  const todayKey = s.won ? s.tries : 'X';
  const keys = s.won ? [1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 'X'];
  row.classList.toggle('end-dist--lost', !s.won);
  row.innerHTML = '';
  for (const key of keys) {
    const isToday = key === todayKey;
    const cell = document.createElement('div');
    cell.className = 'end-dist-cell';
    const tile = document.createElement('div');
    tile.className = 'end-dist-tile' + (isToday ? ' today' : '');
    const label = document.createElement('span');
    label.className = 'end-dist-label' + (isToday ? ' today' : '');
    label.textContent = key;
    cell.append(tile, label);
    row.appendChild(cell);
  }
  row.setAttribute(
    'aria-label',
    s.won ? `Guessed the word in ${s.tries} ${s.tries === 1 ? 'try' : 'tries'}` : 'Did not guess the word in 6 tries',
  );
}

let WORD_DATA = null;

async function loadWordData() {
  if (WORD_DATA) return WORD_DATA;
  const res = await fetch('/booky/words.json?v=6', { cache: 'no-store' });
  WORD_DATA = await res.json();
  return WORD_DATA;
}

function render(key) {
  const s = SCENARIOS[key] || SCENARIOS.win;
  const book = WORD_DATA?.wordBooks?.[s.word];
  const $ = (id) => document.getElementById(id);

  $('end-puzzle-no').textContent = 'Booky #42';
  const cel = $('celebration');
  if (s.won) {
    $('end-headline').textContent = 'Congratulations!';
    cel.classList.remove('lost'); cel.classList.add('won');
  } else {
    $('end-headline').textContent = 'Better luck tomorrow.';
    cel.classList.remove('won'); cel.classList.add('lost');
  }
  $('end-word-reveal').hidden = true;

  $('end-stat-played').textContent = s.played;
  $('end-stat-winpct').textContent = Math.round(100 * s.wins / s.played);
  $('end-stat-streak').textContent = s.streak;
  $('end-stat-max').textContent = s.max;

  const mEl = $('end-milestone');
  const ranksBlock = $('end-ranks');
  const mt = s.won ? milestoneText(s.streak) : null;
  if (mt) {
    mEl.textContent = mt;
    mEl.hidden = false;
    if (ranksBlock) ranksBlock.hidden = false;
  } else {
    mEl.hidden = true;
    if (ranksBlock) ranksBlock.hidden = true;
  }

  renderPreviewDist(s);

  // Book card — title, author, cover from words.json (same as prod)
  const rec = $('book-rec');
  const modal = $('end-modal');
  if (book) {
  rec.classList.remove('book-hero--featured');
  if (modal) modal.classList.remove('end-modal--featured');
  const endWord = $('end-word');
  endWord.textContent = s.word;
  endWord.hidden = false;
  endWord.classList.add('end-word--spoiled', 'end-word--tappable');
  endWord.setAttribute('aria-hidden', 'true');
  endWord.setAttribute('role', 'button');
  endWord.tabIndex = 0;
  endWord.setAttribute('aria-pressed', 'false');
  endWord.setAttribute('aria-label', "Reveal today's word");
  $('book-rec-title').textContent = book.title;
  $('book-rec-author').textContent = book.author;
  if (isFeaturedWin && book.hook) {
    $('book-rec-hook').textContent = book.hook;
    $('book-rec-hook').hidden = false;
  } else {
    $('book-rec-hook').hidden = true;
  }
  if (window.BookyCover) {
    window.BookyCover.applyBookCover($('book-rec-cover'), book);
  }
  const link = $('book-rec-link');
  if (book.buyUrl) {
    link.textContent = 'Get it on Amazon';
    link.href = book.buyUrl;
  } else {
    link.textContent = 'More books like this →';
    link.href = '#';
  }
  link.hidden = false;
  rec.hidden = false;
  } else {
  rec.hidden = true;
  }

  const shareBtn = $('share-btn');
  if (shareBtn) {
    shareBtn.classList.add('share-btn--magic');
  }

  // Highlight active control (standalone testing page only)
  if (!document.body.classList.contains('embedded')) {
  document.querySelectorAll('.pv-bar a').forEach((a) => {
    a.classList.toggle('on', a.dataset.q === key);
    const u = new URL(location.href);
    u.searchParams.set('s', a.dataset.q);
    a.href = u.pathname + u.search;
  });
  }
}

const key = new URLSearchParams(location.search).get('s') || 'win';
loadWordData().then(() => render(key)).catch(() => render(key));
const previewWord = document.getElementById('end-word');
if (previewWord) {
  const togglePreviewWord = () => {
    if (previewWord.hidden) return;
    const spoiled = previewWord.classList.toggle('end-word--spoiled');
    previewWord.setAttribute('aria-hidden', spoiled ? 'true' : 'false');
    previewWord.setAttribute('aria-pressed', spoiled ? 'false' : 'true');
    previewWord.setAttribute('aria-label', spoiled ? "Reveal today's word" : "Hide today's word");
  };
  previewWord.addEventListener('click', togglePreviewWord);
  previewWord.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      togglePreviewWord();
    }
  });
}
document.getElementById('share-btn').addEventListener('click', () => {
  const t = document.getElementById('share-toast');
  t.textContent = 'preview only — sharing works in the real game';
  t.hidden = false; void t.offsetWidth; t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.hidden = true, 260); }, 2200);
});
</script>
</body>
</html>
