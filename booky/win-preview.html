<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Booky win screen — preview</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/booky/styles.css?v=25" />
<style>
  /* Preview chrome only — not part of the game */
  body.win-preview { overflow: auto; }
  .pv-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 9999;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 8px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(6px);
    font-family: Inter, system-ui, sans-serif;
  }
  .pv-bar a {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .pv-bar a.on { background: #d946a8; border-color: #d946a8; }
  /* Embedded in device-preview iframe — hide dev controls, prod-like layout */
  body.embedded .pv-bar { display: none; }
  body.embedded #end-modal[open] { margin: 24px auto; }
  /* Standalone testing page */
  body.win-preview:not(.embedded) #end-modal[open] {
    position: static;
    margin: 52px auto 24px;
  }
  body.embedded #end-modal[open] {
    position: static;
  }
</style>
</head>
<body class="win-preview">
<script>if (window.self !== window.top) document.body.classList.add('embedded');</script>
<div class="bg-glow" aria-hidden="true"></div>

<nav class="pv-bar">
  <a data-q="win">Win</a>
  <a data-q="loss">Loss</a>
  <a data-q="featured">Featured day</a>
  <a data-q="newbie">First win</a>
  <a data-q="streak">Long streak</a>
</nav>

<!-- Same markup as the real end screen (kept in sync with index.html) -->
<dialog id="end-modal" class="sheet" open>
<div class="sheet-inner end-inner">
<button class="sheet-close" aria-label="Close" data-close-end>×</button>

<div class="end-top">
<p id="end-puzzle-no" class="end-puzzle-no"></p>
<div class="celebration" id="celebration">
<h2 id="end-headline" class="celebration-title"></h2>
<p id="end-subtitle" class="celebration-sub"></p>
</div>
<p id="end-word-reveal" class="end-word-reveal" hidden></p>
</div>

<div class="end-stats">
<div class="stat-row end-stat-row">
<div><span id="end-stat-played">0</span><small>played</small></div>
<div><span id="end-stat-winpct">0</span><small>win %</small></div>
<div><span id="end-stat-streak">0</span><small>streak</small></div>
<div><span id="end-stat-max">0</span><small>max</small></div>
</div>
<p id="end-milestone" class="end-milestone" hidden></p>
</div>

<div id="share-block" class="end-share">
<button id="share-btn" class="primary share-btn" type="button">Share</button>
<div id="share-toast" class="share-toast" role="status" aria-live="polite" hidden></div>
</div>

<div id="end-extras" class="end-extras">
<div id="book-rec" class="book-hero book-hero--compact" hidden>
<p id="end-word" class="end-word"></p>
<p class="book-hero-label">📚 Today&rsquo;s word is from</p>
<div class="book-hero-row">
<img id="book-rec-cover" class="book-hero-cover" alt="" hidden />
<div class="book-hero-meta">
<span id="book-rec-badge" class="book-hero-badge" hidden>Featured</span>
<p id="book-rec-title" class="book-hero-title"></p>
<p id="book-rec-author" class="book-hero-author"></p>
<p id="book-rec-hook" class="book-hero-hook" hidden></p>
</div>
</div>
<a id="book-rec-link" class="book-hero-cta secondary-link" target="_blank" rel="noopener" hidden></a>
</div>

<form id="reminder-form" class="reminder-card reminder-card--compact" novalidate>
<p class="reminder-headline">don&rsquo;t lose your 🔥 streak</p>
<div class="reminder-row">
<input type="email" id="reminder-email" placeholder="your@email.com" aria-label="Email for daily reminders" autocomplete="email" inputmode="email" required />
<button type="submit" id="reminder-submit">remind me</button>
</div>
<p class="reminder-toast" id="reminder-toast" hidden></p>
</form>
<p id="reminder-active" class="reminder-active" hidden>📩 Daily reminders on</p>
</div>

<p class="next">next word in <span id="countdown">07:01:53</span></p>
</div>
</dialog>

<script>
const BADGES = [
  { at: 1, icon: '✨', name: 'Initiate', blurb: 'You crossed the veil.' },
  { at: 3, icon: '💫', name: 'Bonded', blurb: 'Three days. Something just clicked.' },
  { at: 7, icon: '🗡️', name: 'Cadet', blurb: 'First week survived. The academy claims you.' },
  { at: 14, icon: '🐉', name: 'Rider', blurb: 'Two weeks. The dragon chose you.' },
  { at: 30, icon: '⚔️', name: 'Knight', blurb: 'A month, sworn. Sharpened by ritual.' },
  { at: 60, icon: '🔮', name: 'Sorceress', blurb: 'Magic mastered. Two months unbroken.' },
  { at: 100, icon: '🏆', name: 'Champion', blurb: '100 days. You won the trial.' },
];
function badgeForStreak(s) {
  let earned = null, next = null;
  for (const b of BADGES) { if (s >= b.at) earned = b; else { next = b; break; } }
  return { earned, next };
}
function milestoneText(s) {
  if (s < 1) return null;
  const { earned, next } = badgeForStreak(s);
  let t = `${earned.icon} ${earned.name} · ${earned.blurb}`;
  if (next) { const r = next.at - s; t += ` ${r} day${r === 1 ? '' : 's'} to ${next.icon} ${next.name}.`; }
  return t;
}

const SCENARIOS = {
  win:      { won: true,  tries: 4, played: 12, wins: 11, streak: 2, max: 5, featured: false,
    title: 'Fourth Wing', author: 'Rebecca Yarros', slug: 'fourth-wing',
    cover: 'https://images-na.ssl-images-amazon.com/images/P/1649374178.01.LZZZZZZZ.jpg' },
  loss:     { won: false, tries: 6, played: 12, wins: 10, streak: 0, max: 5, featured: false, word: 'GHOST',
    title: 'Weavingshaw', author: 'Heba Al-Wasity', slug: 'weavingshaw', cover: 'assets/weavingshaw.jpg' },
  featured: { won: true,  tries: 3, played: 20, wins: 18, streak: 7, max: 9, featured: true,
    title: 'Weavingshaw', author: 'Heba Al-Wasity', slug: 'weavingshaw', cover: 'assets/weavingshaw.jpg', word: 'GHOST' },
  newbie:   { won: true,  tries: 5, played: 1,  wins: 1,  streak: 1, max: 1, featured: false,
    title: 'Fourth Wing', author: 'Rebecca Yarros', slug: 'fourth-wing',
    cover: 'https://images-na.ssl-images-amazon.com/images/P/1649374178.01.LZZZZZZZ.jpg' },
  streak:   { won: true,  tries: 2, played: 40, wins: 38, streak: 29, max: 29, featured: false,
    title: 'Fourth Wing', author: 'Rebecca Yarros', slug: 'fourth-wing',
    cover: 'https://images-na.ssl-images-amazon.com/images/P/1649374178.01.LZZZZZZZ.jpg' },
};

function render(key) {
  const s = SCENARIOS[key] || SCENARIOS.win;
  const $ = (id) => document.getElementById(id);

  $('end-puzzle-no').textContent = 'Booky #42';
  const cel = $('celebration');
  if (s.won) {
    $('end-headline').textContent = 'Congratulations!';
    $('end-subtitle').textContent = `You guessed it in ${s.tries}`;
    $('end-subtitle').hidden = false;
    $('end-word-reveal').hidden = true;
    cel.classList.remove('lost'); cel.classList.add('won');
  } else {
    $('end-headline').textContent = 'Better luck tomorrow.';
    $('end-subtitle').hidden = true;
    $('end-word-reveal').textContent = `The word was ${s.word || 'GHOST'}`;
    $('end-word-reveal').hidden = false;
    cel.classList.remove('won'); cel.classList.add('lost');
  }

  $('end-stat-played').textContent = s.played;
  $('end-stat-winpct').textContent = Math.round(100 * s.wins / s.played);
  $('end-stat-streak').textContent = s.streak;
  $('end-stat-max').textContent = s.max;

  const mEl = $('end-milestone');
  const mt = milestoneText(s.streak);
  if (mt) { mEl.textContent = mt; mEl.hidden = false; } else { mEl.hidden = true; }

  // Book card (always shown in preview)
  const rec = $('book-rec');
  const modal = $('end-modal');
  rec.classList.toggle('book-hero--featured', s.featured);
  modal.classList.toggle('end-modal--featured', s.featured);
  $('book-rec-badge').hidden = !s.featured;
  $('end-word').textContent = s.word || (s.featured ? 'GHOST' : '');
  $('end-word').hidden = !s.featured && !s.word;
  $('book-rec-title').textContent = s.title;
  $('book-rec-author').textContent = s.author;
  if (s.featured && s.hook !== false) {
    $('book-rec-hook').textContent = 'A haunted loom, a cursed bargain, and a love that refuses to unravel.';
    $('book-rec-hook').hidden = false;
  } else {
    $('book-rec-hook').hidden = true;
  }
  const cover = $('book-rec-cover');
  cover.src = s.cover || (s.slug ? `assets/${s.slug}.jpg` : '');
  cover.alt = `${s.title} cover`;
  cover.hidden = false;
  cover.onerror = () => {
    if (s.slug && !cover.src.includes('assets/')) {
      cover.src = `assets/${s.slug}.jpg`;
      cover.onerror = () => { cover.hidden = true; };
    } else {
      cover.hidden = true;
    }
  };
  const link = $('book-rec-link');
  link.textContent = 'More books like this →';
  link.href = '#';
  link.hidden = false;
  rec.hidden = false;

  // Highlight active control (standalone testing page only)
  if (!document.body.classList.contains('embedded')) {
  document.querySelectorAll('.pv-bar a').forEach((a) => {
    a.classList.toggle('on', a.dataset.q === key);
    const u = new URL(location.href);
    u.searchParams.set('s', a.dataset.q);
    a.href = u.pathname + u.search;
  });
  }
}

const key = new URLSearchParams(location.search).get('s') || 'win';
render(key);
document.getElementById('share-btn').addEventListener('click', () => {
  const t = document.getElementById('share-toast');
  t.textContent = 'preview only — sharing works in the real game';
  t.hidden = false; void t.offsetWidth; t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.hidden = true, 260); }, 2200);
});
</script>
</body>
</html>
