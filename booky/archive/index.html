     evicts localStorage on a non-installed site after 7 days without a visit,
     and every player's streak and stats live there. An installed web app is
     exempt from that rule. See booky/manifest.json. -->

<!-- app.js is a `defer` script tag at the BOTTOM of <body> and it is a
     serverless route, not a static file, so the preload scanner does not reach
     it until the whole document has been parsed. Preloading it here starts the
     download immediately, in parallel with the stylesheet and fonts, which
     removes a full round-trip from time-to-grid.

     /api/booky-words is deliberately NOT preloaded. app.js requests it with
     `cache: 'no-store'`, and a no-store fetch bypasses the preload cache
     entirely — the preload would not be reused, so the route would simply be
     invoked twice per page load. Making that hop parallel means relaxing the
     no-store fetch first, which is a freshness change to the daily word and
     does not belong in a performance fix. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />

<body>
<div class="bg-glow" aria-hidden="true"></div>

<!-- Back link — same slim row as the game, so the chrome does not shift -->
<header class="topbar">
<span class="topbar-side">
<!-- Same header as the game, with Back where the menu sits there. The arrow
     returns to the page you came from when that was on 90books, and falls
     back to today's board otherwise (a bookmark, a shared link, a search
     result), so it never dead-ends on an empty history. -->
<button type="button" id="archive-back" class="icon-btn icon-btn-svg" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
</span>
<h1 class="wordmark"><a href="/booky"><img class="wm-light" src="/logo/booky.svg" alt="Booky" width="160" height="26"><img class="wm-dark" src="/logo/booky-light.svg" alt="" aria-hidden="true" width="160" height="26"></a><span class="puzzle-no">Archive</span></h1>
<span class="topbar-side topbar-side-end"></span>
</header>

<main class="archive-page">
<p class="footnote archive-intro">Play every word since day one.<br>
Your streak and stats are not affected.</p>

<ol id="archive-grid" class="archive-grid" reversed>
<li class="archive-item"><p class="archive-caption">Loading past games&hellip;</p></li>
</ol>

<p id="archive-more-wrap" class="archive-more-wrap"><button type="button" id="archive-more" class="archive-more">Show older</button></p>

<p class="archive-foot"><a href="/booky">Play today&rsquo;s word</a> &middot; <a href="/booky-library">Browse every book</a></p>
</main>

<script>
(function installArchiveBack() {
  var btn = document.getElementById('archive-back');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var ref = document.referrer || '';
    var sameSite = false;
    try { sameSite = !!ref && new URL(ref).host === location.host; } catch (e) { sameSite = false; }
    if (sameSite && history.length > 1) history.back();
    else location.href = '/booky';
  });
})();
</script>

<script>
(function () {
  var grid = document.getElementById('archive-grid');

  // Same local-midnight day number the game uses (booky/app.js
  // computeDayNumber). Kept in sync by hand rather than imported: app.js is a
  // serverless route that boots the whole game, and this page must not.
  function dayNumber(epochStr) {
    var p = epochStr.split('-').map(Number);
    var epoch = new Date(p[0], p[1] - 1, p[2], 0, 0, 0).getTime();
    var n = new Date();
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0).getTime();
    return Math.floor((today - epoch) / 86400000) + 1;
  }

  function dateFor(epochStr, day) {
    var p = epochStr.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + (day - 1));
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Which past days this player has already revealed. app.js STILL writes this
  // on every finished game, so the history keeps accumulating; the grid just
  // does not read it yet. Turning the reveal back on is a matter of using this
  // again (2026-09-13, Olga: "we can add that later").
  function seenDays() {
    try {
      var a = JSON.parse(localStorage.getItem('90books_booky_seen_days_v1'));
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  fetch('/api/booky-words', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.epoch || !Array.isArray(data.queue)) throw new Error('bad queue');

      var today = dayNumber(data.epoch);
      var last = Math.min(today - 1, data.queue.length);
      if (last < 1) {
        grid.innerHTML = '<li class="archive-item"><p class="archive-caption">' +
          'No past games yet. Come back tomorrow.</p></li>';
        return;
      }

      var seen = seenDays();

      // Paged, because one-up covers make each card 525px tall: all 111 days at
      // once is a 61,000px page, about 75 phone screens, and it grows by
      // another screen every day and a half. Newest first means the days
      // someone actually wants are in the first page anyway.
      var PAGE = 30;
      var shown = 0;

      function cardsFor(from, to) {
        var html = '';
        for (var day = from; day >= to; day--) {
          html += card(day);
        }
        return html;
      }

      function card(day) {
        var word = String(data.queue[day - 1] || '').toUpperCase();
        var book = (data.wordBooks && data.wordBooks[word]) || null;
        var cover = (book && book.cover) || '/booky/og-image.png';
        var when = dateFor(data.epoch, day);

        // EVERY cover is blurred and EVERY card shows only the date and the
        // puzzle number. No title, no author, no word, and no marker for days
        // you have already played.
        //
        // That is deliberate and it is the whole privacy model of this page:
        // because nothing here is ever revealed, the markup never has to carry
        // a book title or an answer at all, so there is nothing to leak to a
        // reader, a screen reader, "view source", or Google. The blur is CSS,
        // and CSS alone is not a secret. Reinstating the reveal means putting
        // the answers back into the HTML, so weigh that when we do.
        //
        // The `seen` list above is still being written and is intentionally
        // unused here.
        return '<li class="archive-item">' +
            '<a class="archive-link" href="/booky?day=' + day + '" ' +
               'aria-label="Play Booky number ' + day + ', ' + esc(when) + '">' +
              '<span class="archive-cover archive-cover--hidden">' +
                '<img src="' + esc(cover) + '" alt="" loading="lazy" decoding="async" width="200" height="300">' +
              '</span>' +
              '<span class="archive-no">' + esc(when) + ' \u00b7 Booky #' + day + '</span>' +
            '</a>' +
          '</li>';
      }

      var moreBtn = document.getElementById('archive-more');
      var moreWrap = document.getElementById('archive-more-wrap');

      function showMore() {
        var from = last - shown;
        var to = Math.max(1, from - PAGE + 1);
        grid.insertAdjacentHTML('beforeend', cardsFor(from, to));
        shown += from - to + 1;
        var left = last - shown;
        if (left <= 0) {
          moreWrap.hidden = true;
        } else {
          moreBtn.textContent = 'Show older (' + left + ' more)';
        }
      }

      grid.innerHTML = '';
      showMore();

      moreBtn.addEventListener('click', function () {
        var before = shown;
        showMore();
        if (window.posthog && posthog.capture) {
          posthog.capture('booky_archive_show_older', { shown_before: before, shown_after: shown, days_available: last });
        }
      });

      if (window.posthog && posthog.capture) {
        posthog.capture('booky_archive_view', { days_available: last, days_played: seen.length });
      }

      // Which day someone picks is the interesting half. `days_ago` is what
      // answers the real question: do people replay yesterday, or do they dig?
      // Delegated on the grid, so it survives the innerHTML render above and
      // costs one listener instead of 111.
      grid.addEventListener('click', function (e) {
        var link = e.target.closest && e.target.closest('.archive-link');
        if (!link || !window.posthog || !posthog.capture) return;
        var d = Number((link.getAttribute('href').split('day=')[1] || 0));
        if (!d) return;
        posthog.capture('booky_archive_day_opened', {
          word_number: d,
          days_ago: last + 1 - d,
          days_available: last,
        });
      });
    })
    .catch(function () {
      grid.innerHTML = '<li class="archive-item"><p class="archive-caption">' +
        'Could not load past games. <a href="/booky/archive">Try again</a>.</p></li>';
    });
})();
</script>
</body>
</html>
