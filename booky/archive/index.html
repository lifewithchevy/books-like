     evicts localStorage on a non-installed site after 7 days without a visit,
     and every player's streak and stats live there. An installed web app is
     exempt from that rule. See booky/manifest.json. -->
<link rel="manifest" href="/booky/manifest.json" />

<!-- app.js is a `defer` script tag at the BOTTOM of <body> and it is a
     serverless route, not a static file, so the preload scanner does not reach
     it until the whole document has been parsed. Preloading it here starts the
     download immediately, in parallel with the stylesheet and fonts, which
     removes a full round-trip from time-to-grid.

     /api/booky-words is deliberately NOT preloaded. app.js requests it with
     `cache: 'no-store'`, and a no-store fetch bypasses the preload cache
     entirely — the preload would not be reused, so the route would simply be
     invoked twice per page load. Making that hop parallel means relaxing the
     no-store fetch first, which is a freshness change to the daily word and
     does not belong in a performance fix. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />

<body>
<div class="bg-glow" aria-hidden="true"></div>

<!-- Back link — same slim row as the game, so the chrome does not shift -->
<nav class="home-bar" aria-label="Back">
<a href="/booky" class="home-link">
<span aria-hidden="true">&larr;</span> Back to today
</a>

<header class="topbar">
<span class="topbar-side"></span>
<h1 class="wordmark"><a href="/"><img class="wm-light" src="/logo/booky.svg" alt="Booky" width="160" height="26"><img class="wm-dark" src="/logo/booky-light.svg" alt="" aria-hidden="true" width="160" height="26"></a><span class="puzzle-no">Library</span></h1>
<span class="topbar-side topbar-side-end"></span>
</header>

<main class="archive-page">
<p class="archive-intro">Play every word since day one.<br>
<strong>Archive games won&rsquo;t touch your stats.</strong></p>

<ol id="archive-grid" class="archive-grid" reversed>
<li class="archive-item"><p class="archive-caption">Loading past games&hellip;</p></li>
</ol>

<p class="archive-foot"><a href="/booky">Play today&rsquo;s word</a> &middot; <a href="/booky-library">Browse every book</a></p>
</main>

<script>
(function () {
  var grid = document.getElementById('archive-grid');

  // Same local-midnight day number the game uses (booky/app.js
  // computeDayNumber). Kept in sync by hand rather than imported: app.js is a
  // serverless route that boots the whole game, and this page must not.
  function dayNumber(epochStr) {
    var p = epochStr.split('-').map(Number);
    var epoch = new Date(p[0], p[1] - 1, p[2], 0, 0, 0).getTime();
    var n = new Date();
    var today = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0).getTime();
    return Math.floor((today - epoch) / 86400000) + 1;
  }

  function dateFor(epochStr, day) {
    var p = epochStr.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + (day - 1));
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Which past days this player has already revealed. Written by app.js on
  // every finished game (live or archive). Anything not in here stays blurred.
  function seenDays() {
    try {
      var a = JSON.parse(localStorage.getItem('90books_booky_seen_days_v1'));
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  fetch('/api/booky-words', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.epoch || !Array.isArray(data.queue)) throw new Error('bad queue');

      var today = dayNumber(data.epoch);
      var last = Math.min(today - 1, data.queue.length);
      if (last < 1) {
        grid.innerHTML = '<li class="archive-item"><p class="archive-caption">' +
          'No past games yet. Come back tomorrow.</p></li>';
        return;
      }

      var seen = seenDays();
      var html = '';
      // Newest first: the day you most likely missed is the one you want.
      for (var day = last; day >= 1; day--) {
        var word = String(data.queue[day - 1] || '').toUpperCase();
        var book = (data.wordBooks && data.wordBooks[word]) || null;
        var played = seen.indexOf(day) !== -1;
        var cover = (book && book.cover) || '/booky/og-image.png';
        var title = (book && book.title) || 'Booky #' + day;
        var author = (book && book.author) || '';
        var when = dateFor(data.epoch, day);

        // The cover ships for every day; only unplayed ones get the blur, and
        // the blur is CSS. The alt text follows the same rule as the visual,
        // so a screen reader is not handed the answer the page is hiding.
        html +=
          '<li class="archive-item">' +
            '<a class="archive-link" href="/booky?day=' + day + '" ' +
               'aria-label="' + (played
                   ? 'Replay Booky number ' + day + ', ' + esc(title)
                   : 'Play Booky number ' + day + ', ' + esc(when) + ', book hidden') + '">' +
              '<span class="archive-cover' + (played ? '' : ' archive-cover--hidden') + '">' +
                '<span class="archive-no">#' + day + '</span>' +
                (played ? '<span class="archive-solved" aria-hidden="true">&#10003;</span>' : '') +
                '<img src="' + esc(cover) + '" alt="" loading="lazy" decoding="async" width="200" height="300">' +
              '</span>' +
              (played
                ? '<span class="archive-caption">' + esc(title) + (author ? '<br>' + esc(author) : '') + '</span>'
                : '<span class="archive-caption archive-caption--hidden">' + esc(when) + '</span>') +
            '</a>' +
          '</li>';
      }
      grid.innerHTML = html;

      if (window.posthog && posthog.capture) {
        posthog.capture('booky_archive_view', { days_available: last, days_played: seen.length });
      }
    })
    .catch(function () {
      grid.innerHTML = '<li class="archive-item"><p class="archive-caption">' +
        'Could not load past games. <a href="/booky/archive">Try again</a>.</p></li>';
    });
})();
</script>
