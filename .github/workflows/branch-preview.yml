name: Branch preview (Vercel)

# Stable preview URL per branch — NOT production (90books.com).
on:
  push:
    branches: ['cursor/**']
  workflow_dispatch: {}

env:
  VERCEL_ORG_ID: team_wSIVDUUd5X2zNAVCEshu4PDl
  VERCEL_PROJECT_ID: prj_i6QIlyGNgvBL0jBJEB8dpI0vdB10

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Vercel preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" || true
          DEPLOY_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -1)
          if [[ -z "$DEPLOY_URL" ]]; then
            echo "Deploy failed"; cat /tmp/vercel-deploy.log; exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "win=${DEPLOY_URL}/booky/?preview=win" >> "$GITHUB_OUTPUT"
          echo "hub=${DEPLOY_URL}/booky/preview-hub.html" >> "$GITHUB_OUTPUT"

      - name: Write preview status artifact
        run: |
          cat > booky/preview-status.json <<EOF
          {
            "updated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "source": "vercel",
            "vercel": {
              "base": "${{ steps.deploy.outputs.url }}",
              "hub": "${{ steps.deploy.outputs.hub }}",
              "win": "${{ steps.deploy.outputs.win }}",
              "game": "${{ steps.deploy.outputs.url }}/booky/"
            },
            "tunnelOk": false
          }
          EOF

      - name: Upload preview status
        uses: actions/upload-artifact@v4
        with:
          name: preview-status
          path: booky/preview-status.json

      - name: Comment on PR
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const win = '${{ steps.deploy.outputs.win }}';
            const hub = '${{ steps.deploy.outputs.hub }}';
            const body = `## Booky preview (not prod)\n\n**Win screen:** ${win}\n\n**Hub:** ${hub}\n\nStable until next push to this branch.`;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ github.ref_name }}`,
              state: 'open',
            });
            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const marker = '<!-- booky-preview-bot -->';
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              const full = marker + '\n' + body;
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: full,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: full,
                });
              }
            }
