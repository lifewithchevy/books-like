name: Uptime auto-heal

# Runs on GitHub (outside Vercel) every 5 min. If the live site is down it
# AUTOMATICALLY redeploys the full repo to Vercel, re-checks, and only then
# files a GitHub issue: "was down, auto-fixed, no action needed" (or, if the
# redeploy did not help, "still down, needs a look"). You never have to be the
# one who notices and fixes it.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write

# These IDs are not secret (just identifiers). Only the Vercel token is a secret.
env:
  VERCEL_ORG_ID: team_wSIVDUUd5X2zNAVCEshu4PDl
  VERCEL_PROJECT_ID: prj_i6QIlyGNgvBL0jBJEB8dpI0vdB10

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check key routes
        id: check
        run: |
          down=""
          for u in "/" "/books-like/from-blood-and-ash" "/booky" "/genre/romantasy"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://90books.com$u")
            echo "$code  $u"
            [ "$code" != "200" ] && down="$down $u"
          done
          echo "down=$down" >> "$GITHUB_OUTPUT"
          [ -z "$down" ] && echo "All routes healthy."

      - name: Checkout repo (only if down)
        if: steps.check.outputs.down != ''
        uses: actions/checkout@v7

      - name: Auto-redeploy the full site (only if down)
        if: steps.check.outputs.down != ''
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" || true
          vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Re-check and notify (FYI only, only if down)
        if: steps.check.outputs.down != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 25
          still=""
          for u in "/books-like/from-blood-and-ash" "/booky"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://90books.com$u")
            [ "$code" != "200" ] && still="$still $u"
          done
          if [ -z "$still" ]; then
            gh issue create \
              --title "✅ 90books was briefly down and auto-fixed (no action needed)" \
              --repo "${{ github.repository }}" \
              --body "A scheduled check found these routes down:${{ steps.check.outputs.down }}. The site was automatically redeployed and is back to 200. This is an FYI only, nothing for you to do." || true
          else
            gh issue create \
              --title "🔴 90books still down after an auto-redeploy (needs a look)" \
              --repo "${{ github.repository }}" \
              --body "Auto-redeploy did not restore:$still. This one needs manual attention." || true
          fi
