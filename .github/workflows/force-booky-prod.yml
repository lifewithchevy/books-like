name: Force production alias

# Vercel Git integration creates a production deployment on every push to main,
# but the custom domain 90books.com can stay pinned to an older deployment.
# This workflow always deploys with the CLI and re-aliases 90books.com (and
# www / book-recs-app.vercel.app) so merges actually reach the live site.
#
# Runs on EVERY push to main — no path filters. Path-filtered runs were why
# landing FAQ / index.html changes looked "merged" but stayed invisible in prod.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_wSIVDUUd5X2zNAVCEshu4PDl
  VERCEL_PROJECT_ID: prj_i6QIlyGNgvBL0jBJEB8dpI0vdB10

jobs:
  deploy-and-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy production and alias 90books.com
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/deploy.out | tail -n 1)
          echo "Deployed: $URL"
          if [ -z "$URL" ] || [[ "$URL" != https://* ]]; then
            echo "✗ Unexpected deploy URL: $URL"
            cat /tmp/deploy.out
            exit 1
          fi

          alias_set() {
            local host="$1"
            if vercel alias set "$URL" "$host" --token="$VERCEL_TOKEN" --scope omrvieito-9694s-projects; then
              return 0
            fi
            vercel alias set "$URL" "$host" --token="$VERCEL_TOKEN"
          }

          # Fail the job if any production host cannot be pointed at this deploy.
          alias_set 90books.com
          alias_set www.90books.com
          alias_set book-recs-app.vercel.app

          echo "── aliases (sample) ──"
          vercel alias ls --token="$VERCEL_TOKEN" --scope omrvieito-9694s-projects 2>/dev/null | head -40 || true

      - name: Inspect domains via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | head -c 4000
          echo
          curl -sS "https://api.vercel.com/v6/domains/90books.com/config?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | head -c 2000
          echo

      - name: Verify prod paths
        run: |
          set -euo pipefail
          sleep 15

          echo "── 90books.com/ ──"
          code=$(curl -sS -o /tmp/home.html -w "%{http_code}" "https://90books.com/")
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 2
          # Durable smoke checks (not copy-specific — FAQ wording changes often)
          grep -q 'id="lp-faq"' /tmp/home.html && echo "✓ landing FAQ section present"
          grep -qi 'Booky' /tmp/home.html && echo "✓ Booky mentioned on homepage"
          # Confirm we are not stuck on a frozen static object without middleware
          hdr=$(curl -sSI "https://90books.com/" | tr -d '\r')
          echo "$hdr" | grep -qi 'x-edge-middleware: 90books-home-nostore' && echo "✓ homepage via edge middleware" || echo "⚠ missing x-edge-middleware (check cache)"

          echo "── 90books.com/booky ──"
          curl -sSI "https://90books.com/booky" | tr -d '\r' | grep -iE 'HTTP/|location:|x-edge|age:|x-vercel-cache' || true
          bcode=$(curl -sS -o /dev/null -w "%{http_code}" "https://90books.com/booky")
          echo "booky HTTP $bcode"
          [ "$bcode" = "200" ] || exit 2

          echo "── 90books.com/api/booky-words ──"
          wcode=$(curl -sS -o /tmp/w.json -w "%{http_code}" "https://90books.com/api/booky-words")
          echo "HTTP $wcode"
          [ "$wcode" = "200" ] || exit 2
          node -e '
            const d = require("/tmp/w.json");
            if (!Array.isArray(d.queue) || d.queue.length < 30) {
              console.error("✗ queue missing or too short", d.queue && d.queue.length);
              process.exit(2);
            }
            if (!d.epoch || !d.wordBooks) {
              console.error("✗ missing epoch/wordBooks");
              process.exit(2);
            }
            const epoch = new Date(d.epoch + "T00:00:00Z");
            const today = new Date();
            const utc = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()));
            const day = Math.round((utc - epoch) / 86400000) + 1;
            const w = d.queue[day - 1];
            console.log("today (UTC) day", day, "=", w, d.wordBooks[w]?.title || "(no book map)");
            if (!w || typeof w !== "string" || w.length !== 5) {
              console.error("✗ today word missing/invalid");
              process.exit(2);
            }
            console.log("✓ booky-words healthy");
          '
