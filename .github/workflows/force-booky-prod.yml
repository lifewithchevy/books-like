name: Force Booky prod (HONEY)

# Emergency: point 90books.com at a fresh book-recs-app production deploy so
# Jul 18 = HONEY reaches players. Previous deploys only aliased the team URL.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-booky-prod.yml'

env:
  VERCEL_ORG_ID: team_wSIVDUUd5X2zNAVCEshu4PDl
  VERCEL_PROJECT_ID: prj_i6QIlyGNgvBL0jBJEB8dpI0vdB10

jobs:
  deploy-and-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy production and alias 90books.com
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/deploy.out | tail -n 1)
          echo "Deployed: $URL"
          # Explicitly attach the custom domain + primary aliases to THIS deploy.
          # Without this, 90books.com can stay pinned to an older frozen deployment.
          vercel alias set "$URL" 90books.com --token="$VERCEL_TOKEN" --scope omrvieito-9694s-projects || \
          vercel alias set "$URL" 90books.com --token="$VERCEL_TOKEN" || true
          vercel alias set "$URL" book-recs-app.vercel.app --token="$VERCEL_TOKEN" --scope omrvieito-9694s-projects || \
          vercel alias set "$URL" book-recs-app.vercel.app --token="$VERCEL_TOKEN" || true
          vercel alias set "$URL" www.90books.com --token="$VERCEL_TOKEN" --scope omrvieito-9694s-projects || \
          vercel alias set "$URL" www.90books.com --token="$VERCEL_TOKEN" || true
          echo "── aliases for deploy ──"
          vercel alias ls --token="$VERCEL_TOKEN" --scope omrvieito-9694s-projects 2>/dev/null | head -40 || true

      - name: Inspect domains via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -sS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | head -c 4000
          echo
          curl -sS "https://api.vercel.com/v6/domains/90books.com/config?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | head -c 2000
          echo

      - name: Verify HONEY paths
        run: |
          sleep 15
          echo "── 90books.com/booky ──"
          curl -sI "https://90books.com/booky" | tr -d '\r' | grep -iE 'HTTP/|location:|x-edge|age:|x-vercel-cache' || true
          echo "── 90books.com/api/booky-words ──"
          code=$(curl -s -o /tmp/w.json -w "%{http_code}" "https://90books.com/api/booky-words")
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            node -e '
              const d=require("/tmp/w.json");
              const epoch=new Date(d.epoch+"T00:00:00Z");
              const target=new Date("2026-07-18T00:00:00Z");
              const day=Math.round((target-epoch)/86400000)+1;
              const w=d.queue[day-1];
              console.log("Jul 18 =", w, d.wordBooks[w]?.title);
              if (w!=="HONEY") process.exit(2);
            '
          fi
          echo "── booky-deploy control ──"
          curl -s "https://booky-deploy.vercel.app/api/booky-words" | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{
              const d=JSON.parse(s);
              const epoch=new Date(d.epoch+"T00:00:00Z");
              const target=new Date("2026-07-18T00:00:00Z");
              const day=Math.round((target-epoch)/86400000)+1;
              console.log("booky-deploy Jul18=", d.queue[day-1]);
            });
          '
