  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.65;

  .lp-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 48px; background: var(--bg);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;

  .lp-nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .lp-nav-icon {

  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 72px; }
  h1 {

  .lp-site-footer {

  }
  @media (max-width: 520px) { .lp-nav { padding: 12px 16px; } .wrap { padding: 32px 18px 56px; } }

  /* ===== Canonical site header =====================================
     Identical on /, /authors, /privacy, /terms. Appended last so it wins
     over any earlier page-specific nav rule. If you change the header,
     change it here in all four files, not in one page's media query.
     Breakpoints: 900 / 520 / 420. Verified to fit at 320px. */
  .lp-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 18px 48px;
    background: var(--bg); border-bottom: 1px solid var(--border);

  }
  .lp-nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }

    font-size: 13px; font-weight: 700; letter-spacing: -0.5px; flex: 0 0 auto;

  .lp-nav-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .lp-nav-right { display: flex; align-items: center; gap: 10px; }
  .booky-top-cta {
    display: inline-flex; align-items: center; gap: 6px;

    color: #fff; text-decoration: none;

    letter-spacing: 0.2px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(217, 70, 168, 0.28);

  .nav-authors {

  .nav-authors:hover { color: var(--text); text-decoration: underline; }
  @media (max-width: 900px) { .lp-nav { padding: 14px 24px; } }
  @media (max-width: 520px) { .lp-nav { padding: 12px 16px; } }
  @media (max-width: 420px) {

    .lp-nav-right { gap: 8px; }
    .nav-authors { font-size: 12.5px; }
    .booky-top-cta { padding: 6px 10px; font-size: 12px; }
  }
  /* ===== end canonical site header ================================= */

  /* ===== Canonical closing block =====================================
     Same markup and styling as /authors and the landing page. Change all

  .lp-bottom {

  .lp-bottom-title {

  }
  .lp-bottom-sub { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 10px; }
  .bottom-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .lp-bottom .lp-btn-primary {
    display: inline-block; background: #fff; color: #1A1A1A; border: none;
    border-radius: 12px; padding: 16px 28px; font-size: 16px; font-weight: 600;
    font-family: 'Inter', sans-serif; text-decoration: none; text-align: center;
    transition: all 0.2s; white-space: nowrap; cursor: pointer;
  }
  .lp-bottom .lp-btn-primary:hover { background: #f0ede6; transform: translateY(-2px); }
  .lp-bottom .lp-btn-secondary {
    display: inline-block; background: transparent; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.28); border-radius: 12px;
    padding: 14px 24px; font-size: 15px; font-weight: 600;
    font-family: 'Inter', sans-serif; text-decoration: none; transition: all 0.2s;
  }
  .lp-bottom .lp-btn-secondary:hover { border-color: #fff; color: #fff; }
  .bottom-support { font-size: 14px; color: rgba(255,255,255,0.55); margin-top: 12px; max-width: 480px; }

  @media (max-width: 520px) {
    .lp-bottom { padding: 56px 24px; }
    .lp-bottom-title { font-size: 28px; }
    .bottom-row { width: 100%; flex-direction: column; }
    .bottom-row .lp-btn-primary, .bottom-row .lp-btn-secondary { width: 100%; }
  }
  /* ===== end canonical closing block ================================= */
</style>
